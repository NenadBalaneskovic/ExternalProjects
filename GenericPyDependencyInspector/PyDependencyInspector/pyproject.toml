[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pydependencyinspector"
version = "0.1.0"
description = "PyDependencyInspector – a GUI tool for dependency analysis, documentation inspection, and PyInstaller build orchestration."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }

authors = [
  { name = "Nenad Balanesković", email = "you@example.com" }
]

keywords = [
  "dependency-analysis",
  "PyInstaller",
  "GUI",
  "PySide6",
  "documentation",
  "build-tools",
  "python-packaging"
]

classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
  "PySide6>=6.6",
  "numpy>=1.24",
  "pandas>=2.0",
  "pyarrow>=15.0",
  "scikit-learn>=1.4",
  "statsmodels>=0.14",
  "flaml>=2.1",
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "scipy>=1.11",
  "joblib>=1.3",
  "pydantic>=2.6",
  "jinja2>=3.1",
  "reportlab>=4.0",
  "markdown>=3.5",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "black",
  "ruff",
  "mypy",
  "pytest",
  "pytest-cov",
  "ipykernel",
]

[project.urls]
Homepage = "https://example.com/pydependencyinspector"
Repository = "https://example.com/pydependencyinspector.git"
Issues = "https://example.com/pydependencyinspector/issues"

[project.scripts]
pydependencyinspector = "pydependencyinspector.entry_point:main"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
