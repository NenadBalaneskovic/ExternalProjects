[flake8]
max-line-length = 120
exclude = 
    .git,
    __pycache__,
    build,
    dist,
    .venv,
    .mypy_cache,
    .ruff_cache
ignore = 
    E203,
    E266,
    E501,
    W503

[tool:pytest]
addopts = 
    --maxfail=1
    --disable-warnings
    --strict-markers
    --cov=pydependencyinspector
    --cov-report=term-missing
testpaths = 
    tests

[coverage:run]
branch = True
source = 
    pydependencyinspector

[coverage:report]
show_missing = True
skip_covered = True

[mypy]
python_version = 3.10
warn_unused_configs = True
warn_unused_ignores = True
warn_redundant_casts = True
warn_return_any = True
warn_unreachable = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
ignore_missing_imports = True
exclude = 
    build/
    dist/
    tests/

[isort]
profile = black
line_length = 120
multi_line_output = 3
include_trailing_comma = True
force_grid_wrap = 0
use_parentheses = True

[black]
line-length = 120
target-version = ['py310']
exclude = 
    /(
        \.git
      | \.venv
      | build
      | dist
      | __pycache__
    )/
