[metadata]
name = pumpitup
version = 0.1.0
description = DrivenData Pump-It-Up ML pipeline with stacking and Optuna tuning

[options]
packages = find:
python_requires = >=3.12
install_requires =
    numpy
    pandas
    scikit-learn
    lightgbm
    xgboost
    catboost
    optuna
    duckdb
    pyarrow
    category-encoders

[options.packages.find]
exclude =
    data